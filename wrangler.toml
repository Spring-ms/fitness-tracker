name = "fitness-tracker"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Static front end. API routes run in the Worker first; everything else is served from public/.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fitness-db"
# Replace with the real ID printed by `npx wrangler d1 create fitness-db`.
database_id = "00000000-0000-0000-0000-000000000000"
